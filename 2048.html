<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --board-bg: #1e293b;
            --tile-bg: #334155;
            --text-color: #e2e8f0;
            --accent: #f97316;
        }

        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 300px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            color: var(--accent);
            text-shadow: 2px 2px 0px #000;
        }

        .score-container {
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid #334155;
            font-size: 12px;
        }

        #score {
            font-size: 16px;
            margin-top: 4px;
            color: #fff;
        }

        #game-container {
            position: relative;
            background-color: var(--board-bg);
            border-radius: 12px;
            padding: 10px;
            border: 3px solid #334155;
        }

        canvas {
            display: block;
            border-radius: 8px;
            background-color: rgba(0,0,0,0.2);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            background: var(--accent);
            border: none;
            padding: 10px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 #c2410c;
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #c2410c;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            border: 2px solid var(--accent);
            z-index: 10;
        }

        #game-over h2 {
            margin: 0 0 15px 0;
            color: var(--accent);
            font-size: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>2048</h1>
        <div class="score-container">
            <div>SCORE</div>
            <div id="score">0</div>
        </div>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas" width="300" height="300"></canvas>
        <div id="game-over">
            <h2>GAME OVER</h2>
            <button onclick="resetGame()">Try Again</button>
        </div>
    </div>

    <div class="controls">
        <button onclick="resetGame()">New Game</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('game-over');
        
        const gridSize = 4;
        const tileSize = 65;
        const padding = 10;
        
        let grid = [];
        let score = 0;
        let isGameOver = false;
        let touchStartX = 0;
        let touchStartY = 0;

        // Tile Colors
        const colors = {
            0: '#1e293b',
            2: '#f1f5f9',
            4: '#cbd5e1',
            8: '#94a3b8',
            16: '#64748b',
            32: '#475569',
            64: '#334155',
            128: '#f59e0b',
            256: '#f97316',
            512: '#ef4444',
            1024: '#ec4899',
            2048: '#8b5cf6'
        };

        function initGrid() {
            grid = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
            score = 0;
            isGameOver = false;
            scoreEl.textContent = score;
            gameOverEl.style.display = 'none';
            spawnTile();
            spawnTile();
            draw();
        }

        function spawnTile() {
            const empty = [];
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (grid[r][c] === 0) empty.push({r, c});
                }
            }
            if (empty.length === 0) return;
            const {r, c} = empty[Math.floor(Math.random() * empty.length)];
            grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw tiles
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const val = grid[r][c];
                    const x = padding + c * (tileSize + 6);
                    const y = padding + r * (tileSize + 6);
                    
                    ctx.fillStyle = colors[val] || '#ec4899';
                    ctx.fillRect(x, y, tileSize, tileSize);
                    
                    if (val > 0) {
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 20px "Press Start 2P"';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(val, x + tileSize/2, y + tileSize/2);
                    }
                }
            }
        }

        function move(direction) {
            if (isGameOver) return;
            let moved = false;
            
            // Helper to rotate grid
            const rotate = (matrix) => matrix[0].map((val, i) => matrix.map(row => row[i]).reverse());
            // Helper to reverse rows (for right/left logic)
            const reverse = (matrix) => matrix.map(row => [...row].reverse());

            // Normalize movement to left logic
            let workGrid = grid;
            let rotations = 0;
            if (direction === 'up') { rotations = 1; workGrid = rotate(grid); }
            if (direction === 'right') { rotations = 0; workGrid = reverse(grid); }
            if (direction === 'down') { rotations = 3; workGrid = rotate(rotate(rotate(grid))); }

            // Slide and Merge logic
            let newGrid = workGrid.map(row => {
                // Filter non-zero
                let arr = row.filter(v => v);
                // Merge
                for (let i = 0; i < arr.length - 1; i++) {
                    if (arr[i] === arr[i+1]) {
                        arr[i] *= 2;
                        score += arr[i];
                        arr.splice(i+1, 1);
                        moved = true;
                    }
                }
                // Pad with zeros
                while (arr.length < gridSize) arr.push(0);
                return arr;
            });

            // Restore rotation
            // We simply reconstruct the grid based on rotations. 
            // But this simplified logic only updates values correctly if we rotate back.
            // Let's map back:
            if (direction === 'left') grid = newGrid;
            if (direction === 'right') grid = newGrid.map(row => [...row].reverse());
            if (direction === 'up') { 
                grid = [];
                // Transpose (which is rotate(-90) from original left)
                for(let c=0; c<gridSize; c++){
                    let col = [];
                    for(let r=0; r<gridSize; r++){
                        col.push(newGrid[r][c]);
                    }
                    grid.push(col);
                }
            }
            if (direction === 'down') {
                grid = [];
                for(let c=0; c<gridSize; c++){
                    let col = [];
                    for(let r=0; r<gridSize; r++){
                        col.push(newGrid[r][c]);
                    }
                    grid.push(col.reverse());
                }
            }

            scoreEl.textContent = score;
            
            if (moved) {
                spawnTile();
                draw();
                checkGameOver();
            }
        }

        function checkGameOver() {
            // Check for empty tiles
            for(let r=0; r<gridSize; r++)
                for(let c=0; c<gridSize; c++)
                    if(grid[r][c]===0) return;

            // Check for merges
            for(let r=0; r<gridSize; r++) {
                for(let c=0; c<gridSize; c++) {
                    if (r < gridSize-1 && grid[r][c] === grid[r+1][c]) return;
                    if (c < gridSize-1 && grid[r][c] === grid[r][c+1]) return;
                }
            }
            isGameOver = true;
            gameOverEl.style.display = 'block';
        }

        function resetGame() {
            initGrid();
        }

        // Input Handling
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowUp') move('up');
            if(e.key === 'ArrowDown') move('down');
            if(e.key === 'ArrowLeft') move('left');
            if(e.key === 'ArrowRight') move('right');
        });

        // Touch Handling
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: false});

        document.addEventListener('touchend', (e) => {
            if (isGameOver) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            const threshold = 30;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > threshold) {
                    move(dx > 0 ? 'right' : 'left');
                }
            } else {
                if (Math.abs(dy) > threshold) {
                    move(dy > 0 ? 'down' : 'up');
                }
            }
        }, {passive: false});

        initGrid();
    </script>
</body>
</html>
