<html lang="en">
<head>

    <title>Mac Cartier - Resume</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #525659; /* Matches standard PDF viewer dark grey */
        }
        .pdf-container {
            width: 100%;
            height: 100vh; /* 100% of the Viewport Height */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Fallback styling for mobile or browsers that block embeds */
        .fallback {
            text-align: center;
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            color: white;
            padding: 20px;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: white;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="pdf-container">
        <object data="Resume2026.pdf" type="application/pdf" width="100%" height="100%">
            
            <div class="fallback">
