<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mac Cartier</title>
    <style>
        /* CSS RESET & BASICS */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Fanwood', 'EB Garamond', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            background-color: #f4f4f4; /* Soft grey/white for the page */
            color: #333;
        }

        /* CONTAINER: Centers everything */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        /* HEADER TYPOGRAPHY */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 3rem;
            font-family: 'Helvetica', 'Arial', sans-serif; /* Contrast font for title */
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* BUTTON LINKS */
        .links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            color: #333;
            border: 2px solid #333;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        /* HOVER EFFECTS */
        .btn:hover {
            background-color: #333;
            color: #fff;
        }

        /* FOOTER */
        .footer {
            margin-top: 4rem;
            font-size: 0.9rem;
            color: #888;
        }
        
        .footer a {
            color: #888;
            text-decoration: none;
            border-bottom: 1px dotted #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mac Cartier</h1>
        <div class="subtitle">Principal Electrical Engineer &middot; Avionics</div>

        <div class="links">
            <a href="Resume2026.pdf" class="btn" target="_blank">View Resume</a>
            <a href="Polar_Koch_AES_Final.pdf" class="btn" target="_blank">Read Research</a>
        </div>

        <div class="footer">
            mac.c.cartier@gmail.com &middot; <a href="https://github.com/maccartier">GitHub</a>
        </div>
    </div>

</body>
</html>
